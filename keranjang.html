<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang Belanja | Orecloth</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- FontAwesome untuk Icon Interaksi -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <nav class="navbar">
      <a href="index.html" class="logo">Orecloth</a>

      <ul class="nav-menu">
        <li><a href="index.html">Beranda</a></li>
        <li><a href="kategori.html">Kategori</a></li>
      </ul>

      <div class="nav-actions">
        <input type="text" id="search-input" placeholder="Cari baju..." onkeyup="searchProduct(this.value)" />
        <a href="login.html" class="login-link"><i class="fa-solid fa-user"></i> Masuk</a>
        <a href="keranjang.html" class="cart-link">
          <i class="fa-solid fa-basket-shopping"></i><span id="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- HALAMAN KERANJANG -->
  <main class="cart-page" style="padding: 20px 8%;">
    <section class="cart-section">
      <div class="section-title">
        <h2>Keranjang Belanja</h2>
        <p>Periksa kembali pakaian pilihanmu sebelum checkout.</p>
      </div>

      <!-- Container Utama Keranjang -->
      <div class="cart-container">
        
        <!-- Daftar Item Belanjaan (Akan di-render oleh JavaScript) -->
        <div class="cart-items" id="cart-list">
          <!-- Diisi otomatis via script.js -->
        </div>

        <!-- Ringkasan Pembayaran -->
        <aside class="cart-summary">
          <h3>Ringkasan Belanja</h3>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">Rp0</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="total">Rp0</span>
          </div>
          <!-- Tombol Lanjut ke Form Alamat -->
          <a href="checkout.html" class="btn-primary" style="display: block; text-align: center; margin-top: 20px; border-radius: 8px;">
            Lanjut ke Checkout <i class="fa-solid fa-chevron-right" style="font-size: 11px; margin-left: 4px;"></i>
          </a>
        </aside>

      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 Orecloth Store.</p>
  </footer>

  <!-- KOMPONEN MOBILE: BOTTOM NAVIGATION BAR -->
  <nav class="mobile-bottom-nav">
    <a href="index.html">
      <i class="fa-solid fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="kategori.html">
      <i class="fa-solid fa-border-all"></i>
      <span>Kategori</span>
    </a>
    <a href="keranjang.html" class="active">
      <i class="fa-solid fa-basket-shopping"></i>
      <span id="cart-count">0</span>
      <span>Keranjang</span>
    </a>
    <a href="login.html">
      <i class="fa-solid fa-user"></i>
      <span>Akun</span>
    </a>
  </nav>

  <!-- CORE JAVASCRIPT GLOBAL -->
  <script src="js/script.js"></script>

  <!-- Logika Sinkronisasi Render Halaman Keranjang Statis untuk GitHub Pages -->
  <script>
    // Override fungsi renderCart bawaan agar output HTML sesuai dengan spek mobile varian (Size & Color)
    function renderCart() {
      const cartList = document.getElementById("cart-list");
      const subtotalElement = document.getElementById("subtotal");
      const totalElement = document.getElementById("total");

      if (!cartList) return;

      // Ambil data keranjang dari global state / localStorage
      const localCart = JSON.parse(localStorage.getItem("cart")) || [];
      cartList.innerHTML = "";

      let subtotal = 0;

      if (localCart.length === 0) {
        cartList.innerHTML = `
          <div class="cart-item" style="display: block; text-align: center; padding: 30px 10px;">
            <i class="fa-solid fa-folder-open" style="font-size: 40px; color: #ddd; margin-bottom: 10px; display: block;"></i>
            <h3>Keranjangmu masih kosong</h3>
            <p style="color: #777; font-size: 13px;">Yuk, cari baju casual stylish terlebih dahulu!</p>
            <a href="kategori.html" class="btn-secondary" style="margin-top: 15px; font-size: 12px; padding: 8px 16px; display: inline-block; border-radius: 20px;">Mulai Belanja</a>
          </div>
        `;
        if (subtotalElement) subtotalElement.textContent = "Rp0";
        if (totalElement) totalElement.textContent = "Rp0";
        return;
      }

      localCart.forEach((item, index) => {
        subtotal += item.price * item.quantity;

        cartList.innerHTML += `
          <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" />

            <div class="cart-info">
              <h3 style="font-size: 14px; margin-bottom: 4px;">${item.name}</h3>
              <p style="font-size: 11px; color: #777; margin-bottom: 4px;">Varian: <strong>${item.size}</strong> / <strong>${item.color}</strong></p>
              <p class="price" style="font-size: 14px; margin: 0; color: var(--primary); font-weight: bold;">Rp${(item.price).toLocaleString('id-ID')}</p>
            </div>

            <div class="cart-qty" style="text-align: center;">
              <label style="font-size: 11px; display: block; margin-bottom: 4px;">Jumlah</label>
              <input 
                type="number" 
                value="${item.quantity}" 
                min="1" 
                style="width: 55px; text-align: center; padding: 4px; border-radius: 6px; border: 1px solid #ddd;"
                onchange="updateQtyMobile(${index}, this.value)" 
              />
            </div>

            <button class="btn-remove" onclick="removeCartMobile(${index})" style="background: #f5f5f5; color: #c0392b; padding: 8px 10px; border-radius: 50%; font-size: 14px;">
              <i class="fa-solid fa-trash-can" style="margin: 0;"></i>
            </button>
          </div>
        `;
      });

      if (subtotalElement) subtotalElement.textContent = "Rp" + subtotal.toLocaleString("id-ID");
      if (totalElement) totalElement.textContent = "Rp" + subtotal.toLocaleString("id-ID");
    }

    // Fungsi update jumlah item khusus basis index array lokal
    function updateQtyMobile(index, val) {
      let localCart = JSON.parse(localStorage.getItem("cart")) || [];
      let newQty = parseInt(val);
      if (newQty < 1 || isNaN(newQty)) newQty = 1;
      
      localCart[index].quantity = newQty;
      localStorage.setItem("cart", JSON.stringify(localCart));
      
      renderCart();
      const cartCountElements = document.querySelectorAll('#cart-count');
      const totalItems = localCart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountElements.forEach(el => el.textContent = totalItems);
    }

    // Fungsi hapus item khusus basis index array lokal
    function removeCartMobile(index) {
      let localCart = JSON.parse(localStorage.getItem("cart")) || [];
      localCart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(localCart));
      
      renderCart();
      const cartCountElements = document.querySelectorAll('#cart-count');
      const totalItems = localCart.reduce((sum, item) => sum + item.quantity, 0);
      cartCountElements.forEach(el => el.textContent = totalItems);
      showToast("❌ Item berhasil dihapus dari keranjang");
    }

    // Jalankan render ulang saat dokumen siap
    document.addEventListener("DOMContentLoaded", () => {
      renderCart();
    });
  </script>
</body>
</html>
